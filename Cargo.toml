[package]
name = "guardaudit"
version = "0.1.0"
authors = ["Intermountainh8ter"]
edition = "2021"
license = "MIT"
description = "Safety-classifier calibration audit: Brier, ECE, and per-threshold precision/recall under OOD distribution shift."
repository = "https://github.com/Intermountainh8ter/guardaudit"
keywords = ["llm", "safety-classifier", "calibration", "llama-guard", "audit"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.8"
rand_pcg = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt", "macros", "time"] }
thiserror = "1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }

[[bin]]
name = "guardaudit"
path = "src/main.rs"

[lib]
name = "guardaudit"
path = "src/lib.rs"
